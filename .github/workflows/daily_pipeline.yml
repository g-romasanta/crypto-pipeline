# GITHUB ACTIONS WORKFLOW
# Runs the ETL pipeline every day on a free GitHub-hosted runner and commits
# the updated data back to the repo. No cloud account, no stored credentials.

name: Daily Crypto Pipeline

on:
  schedule:
    # 6:00 AM UTC daily (cron times on GitHub are always UTC). Scheduled
    # runs can start a few minutes late when GitHub is busy.
    - cron: "17 6 * * *"
  workflow_dispatch:   # "Run workflow" button for manual testing

# The built-in GITHUB_TOKEN needs write access so the job can commit data.
permissions:
  contents: write

# Never run two copies at once (avoids push conflicts).
concurrency:
  group: daily-crypto-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL pipeline
        env:
          # Optional secret; the pipeline works without it.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python scripts/main.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_prices.csv reports/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily prices $(date -u +%F)"
            git push
          fi
